<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kütüphane - Üye Kayıt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .header-section {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .register-card {
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header-section">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1 class="mb-0"><i class="bi bi-person-plus"></i> Üye Kayıt</h1>
                    <p class="mb-0 mt-2">Kütüphane sistemine üye olun</p>
                </div>
                <div class="col-md-4 text-end">
                    <a href="user.html" class="btn btn-outline-light">
                        <i class="bi bi-arrow-left"></i> Giriş Sayfası
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="register-card">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0"><i class="bi bi-person-plus"></i> Yeni Üye Kaydı</h5>
                </div>
                <div class="card-body">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="adSoyadInput" class="form-label">Ad Soyad <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="adSoyadInput" placeholder="Adınızı ve soyadınızı giriniz" required>
                        </div>
                        <div class="mb-3">
                            <label for="emailInput" class="form-label">E-posta <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="email" class="form-control" id="emailInput" placeholder="E-posta adresinizi giriniz" required>
                                <button type="button" class="btn btn-outline-primary" id="sendCodeBtn" onclick="sendVerificationCode()">
                                    <span class="spinner-border spinner-border-sm d-none" id="sendCodeSpinner"></span>
                                    <i class="bi bi-envelope"></i> Kod Gönder
                                </button>
                            </div>
                            <small class="form-text text-muted">E-posta adresinize doğrulama kodu gönderilecektir</small>
                        </div>
                        <div class="mb-3" id="verificationCodeContainer" style="display: none;">
                            <label for="verificationCodeInput" class="form-label">Doğrulama Kodu <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="verificationCodeInput" placeholder="6 haneli doğrulama kodunu giriniz" maxlength="6" pattern="[0-9]{6}">
                                <button type="button" class="btn btn-outline-success" id="verifyCodeBtn" onclick="verifyCode()">
                                    <span class="spinner-border spinner-border-sm d-none" id="verifyCodeSpinner"></span>
                                    <i class="bi bi-check-circle"></i> Doğrula
                                </button>
                            </div>
                            <small class="form-text text-muted">E-posta adresinize gönderilen 6 haneli kodu giriniz</small>
                            <div id="codeStatus" class="mt-2"></div>
                        </div>
                        <div class="mb-3">
                            <label for="telefonInput" class="form-label">Telefon <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" id="telefonInput" placeholder="05551234567" required maxlength="11" pattern="[0-9]{11}">
                            <small class="form-text text-muted">11 haneli telefon numaranızı giriniz (örn: 05551234567)</small>
                        </div>
                        <div class="mb-3">
                            <label for="uyeNoInput" class="form-label">Üye Numarası <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="uyeNoInput" placeholder="6 haneli üye numaranızı giriniz" required maxlength="6" pattern="[0-9]{6}">
                            <small class="form-text text-muted">6 haneli bir numara seçiniz (örn: 123456)</small>
                        </div>
                        <div id="registerAlert" class="alert d-none" role="alert"></div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg" id="registerBtn">
                                <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true" id="registerSpinner"></span>
                                <i class="bi bi-person-plus"></i> Üye Ol
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="register-script.js"></script>
</body>
</html>
